name: Build Windows, macOS & Linux

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt5 mss pywin32 pyinstaller pyvirtualcam numpy opencv-python uiautomation

      - name: Build exe
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "ProjectionPad" `
            --hidden-import=PyQt5.sip `
            --hidden-import=mss `
            --hidden-import=mss.windows `
            --hidden-import=win32gui `
            --hidden-import=win32process `
            --hidden-import=win32api `
            --hidden-import=win32con `
            --hidden-import=pyvirtualcam `
            --hidden-import=numpy `
            --hidden-import=cv2 `
            --hidden-import=uiautomation `
            --collect-submodules=mss `
            --collect-submodules=pyvirtualcam `
            projection_pad.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectionPad-Windows
          path: dist/ProjectionPad.exe
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProjectionPad.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt5 mss pyinstaller pyvirtualcam numpy opencv-python pyobjc-framework-Quartz

      - name: Build macOS app
        run: |
          pyinstaller \
            --windowed \
            --name "ProjectionPad" \
            --hidden-import=PyQt5.sip \
            --hidden-import=mss \
            --hidden-import=mss.darwin \
            --hidden-import=pyvirtualcam \
            --hidden-import=numpy \
            --hidden-import=cv2 \
            --hidden-import=Quartz \
            --collect-submodules=mss \
            --collect-submodules=pyvirtualcam \
            projection_pad.py
          cd dist && zip -r ProjectionPad-macOS.zip ProjectionPad.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectionPad-macOS
          path: dist/ProjectionPad-macOS.zip
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProjectionPad-macOS.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt5 mss pyinstaller pyvirtualcam numpy opencv-python

      - name: Build Linux binary
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "ProjectionPad" \
            --hidden-import=PyQt5.sip \
            --hidden-import=mss \
            --hidden-import=mss.linux \
            --hidden-import=pyvirtualcam \
            --hidden-import=numpy \
            --hidden-import=cv2 \
            --collect-submodules=mss \
            --collect-submodules=pyvirtualcam \
            projection_pad.py
          cd dist && tar -czf ProjectionPad-Linux.tar.gz ProjectionPad

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectionPad-Linux
          path: dist/ProjectionPad-Linux.tar.gz
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProjectionPad-Linux.tar.gz
